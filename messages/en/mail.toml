# 英文邮件模板。<key>_subject / <key>_body 成对使用。
verify_email_subject = 'Verify your cgin email address'
verify_email_body = '''Hi {{.Name}},

Your verification code is {{.Code}}.

It expires in {{.TTL}} minutes. If you did not request this, you can ignore this email.
'''

