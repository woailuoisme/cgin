{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cgin.fullname" . }}
  labels:
    {{- include "cgin.labels" (dict "context" . "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secret.JWT_SECRET | quote }}
  APP_KEY: {{ .Values.secret.APP_KEY | quote }}
  DB_PASSWORD: {{ .Values.secret.DB_PASSWORD | quote }}
  VALKEY_PASSWORD: {{ .Values.secret.VALKEY_PASSWORD | quote }}
  S3_ACCESS_KEY: {{ .Values.secret.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ .Values.secret.S3_SECRET_KEY | quote }}
  {{- range $key, $val := .Values.secret.extraSecret }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}

