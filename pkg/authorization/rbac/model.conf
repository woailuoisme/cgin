# 基础 RBAC。刻意不定义 [role_definition]（g 角色继承）：用户到角色的归属由 user.role 列承载，见 ADR-0003。
#
# matcher 同时服务两种鉴权形态，扩展策略前务必区分：
#   1. 资源级（mw.Can）：obj 是裸资源名（如 "users"），act 是业务动作（如 "list"），只走精确匹配；
#   2. 路径级（gin-contrib/authz）：obj 是请求路径（如 "/v1/admin/users"），act 是 HTTP 方法，
#      由 keyMatch2 通配与 regexMatch 兜底。
# ⚠ 因此传给资源级鉴权的 resource 名绝不能写成 URL 形态（如以 /v1/ 开头），
#   否则会被路径通配规则误放行——该边界由 test/pkg/authorization 的回归用例锁定。
#
# 注：casbin 的 regexMatch 是子串匹配；act 白名单当前依赖 HTTP 方法集合互不为子串这一事实。
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && (r.obj == p.obj || keyMatch2(r.obj, p.obj)) && (p.act == "*" || r.act == p.act || regexMatch(r.act, p.act))
