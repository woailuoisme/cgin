# 基础 RBAC（资源 + 动作精确匹配，支持通配符 *）。
# 用户到角色的归属由 user.role 列承载，见 ADR-0003。
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
