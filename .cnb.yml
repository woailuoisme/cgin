# ── 全局：手动触发 & 标签发布 ────────────────────────────────────────
# 项目: cgin (Go Gin RESTful Web API)
# Go 版本: 1.27.4 | 入口: ./cmd/api | 二进制: cgin
# Dockerfile 位于仓库根，基于 Alpine 极简镜像构建与运行

# ── main 分支：网页手动触发（常规 push 不触发构建）──────────────────
main:
  # 网页按钮：手动构建并推送 Docker 镜像（对齐 .cnb/web_trigger.yml 中的 web_trigger_amd64）
  web_trigger_amd64: &docker_build
    - services:
        - docker
      stages:
        - name: Manual Docker build and push
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=registry,ref=${REGISTRY}:cache \
              --cache-to type=registry,ref=${REGISTRY}:cache,mode=max,image-manifest=true,oci-mediatypes=true \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              --push .

  # 兼容默认网页触发
  web_trigger: *docker_build

# ── 正式全量发版 (v*)：镜像与 Chart 原子化联动自动发布 ───────────────
v*:
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"

            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=registry,ref=${REGISTRY}:cache \
              --cache-to type=registry,ref=${REGISTRY}:cache,mode=max,image-manifest=true,oci-mediatypes=true \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              -t "${REGISTRY}:${VERSION}" \
              --build-arg VERSION="${VERSION}" \
              --build-arg COMMIT="${CNB_COMMIT:-none}" \
              --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --push .

        # 注意：stages 下的元素是 Job（不是嵌套的 Pipeline）。
        # 容器镜像写在 job 的 `image:` 上；写 `docker:` + 内层 `stages:` 会被静默忽略，
        # 该 job 变成空阶段（构建仍显示 success，但什么都没执行）。
        - name: Helm chart package & push
          image: alpine/helm:4
          script: |
            set -euo pipefail
            VERSION="${CNB_BRANCH##*/}"
            CHART_VERSION="${VERSION#v}"
            HELM_REGISTRY="${CNB_HELM_REGISTRY:-helm.cnb.cool}"
            TARGET_NAMESPACE="${CNB_GROUP_SLUG_LOWERCASE:-${CNB_REPO_SLUG_LOWERCASE}}"

            echo "${CNB_TOKEN}" | helm registry login "${HELM_REGISTRY}" -u "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin
            helm package helm/cgin --version "${CHART_VERSION}" --app-version "${VERSION}" -d .
            helm push "cgin-${CHART_VERSION}.tgz" "oci://${HELM_REGISTRY}/${TARGET_NAMESPACE}"

        - name: Generate CHANGELOG
          image: orhunp/git-cliff:latest
          script: |
            set -eu
            git-cliff --latest --strip header -o CHANGELOG.md

        - name: Create CNB Release
          type: git:release
          options:
            # tag_push 事件下无需传 tag（官方：自动取触发的 Tag 名）
            title: "Release ${CNB_BRANCH}"
            descriptionFromFile: CHANGELOG.md
            latest: true
