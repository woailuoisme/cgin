# ── 全局：手动触发 & 标签发布 ────────────────────────────────────────
# 项目: cgin (Go Gin RESTful Web API)
# Go 版本: 1.27.3 | 入口: ./cmd/api | 二进制: cgin
# Dockerfile 位于仓库根，基于 Alpine 极简镜像构建与运行

# ── main 分支：仅保留网页手动触发，常规 push 不触发构建 ──────────────
main:
  web_trigger:
    - services:
        - docker
      stages:
        - name: Manual Docker build and push
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=registry,ref=${REGISTRY}:cache \
              --cache-to type=registry,ref=${REGISTRY}:cache,mode=max,image-manifest=true,oci-mediatypes=true \
              -t "${REGISTRY}:latest" \
              --push .

# ── 版本发布：仅在推送标签 (tag_push) 时自动执行 ────────────────────
$:
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"
            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=registry,ref=${REGISTRY}:cache \
              --cache-to type=registry,ref=${REGISTRY}:cache,mode=max,image-manifest=true,oci-mediatypes=true \
              -t "${REGISTRY}:${VERSION}" \
              -t "${REGISTRY}:latest" \
              --push .

        - name: Package and push Helm chart to CNB
          script: |
            set -euo pipefail
            VERSION="${CNB_BRANCH##*/}"
            CHART_VERSION="${VERSION#v}"
            HELM_REGISTRY="${CNB_HELM_REGISTRY:-helm.cnb.cool}"

            # 借助 alpine/helm 容器打包并发布 OCI Chart 到 CNB 制品库
            docker run --rm \
              -v "$(pwd):/apps" \
              -w /apps \
              -e CNB_TOKEN="${CNB_TOKEN}" \
              -e CNB_TOKEN_USER_NAME="${CNB_TOKEN_USER_NAME:-cnb}" \
              -e HELM_REGISTRY="${HELM_REGISTRY}" \
              -e CNB_REPO_SLUG_LOWERCASE="${CNB_REPO_SLUG_LOWERCASE}" \
              -e CHART_VERSION="${CHART_VERSION}" \
              -e VERSION="${VERSION}" \
              alpine/helm:latest sh -euo pipefail -c '
                echo "${CNB_TOKEN}" | helm registry login "${HELM_REGISTRY}" -u "${CNB_TOKEN_USER_NAME}" --password-stdin
                helm package deploy/helm/cgin --version "${CHART_VERSION}" --app-version "${VERSION}" -d /apps
                helm push "/apps/cgin-${CHART_VERSION}.tgz" "oci://${HELM_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
              '
