# Default values for cgin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  registry: ""
  repository: cgin
  # tag defaults to Chart.AppVersion if not specified
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65534

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# API HTTP 核心服务配置 (cgin serve)
api:
  replicaCount: 2
  command:
    - /app/cgin
    - serve
  service:
    type: ClusterIP
    port: 80
    targetPort: 3300

  probes:
    liveness:
      path: /livez
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Asynq 异步队列工作节点 (cgin queue:work)
worker:
  enabled: true
  replicaCount: 1
  command:
    - /app/cgin
    - queue:work
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ingress 路由配置
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: cgin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cgin-tls
  #    hosts:
  #      - cgin.example.com

# 运行期非敏感环境变量（存储在 ConfigMap 中）
config:
  APP_NAME: "cgin"
  APP_ENV: "production"
  APP_PORT: "3300"
  APP_HOST: "0.0.0.0"
  TZ: "Asia/Shanghai"
  # 数据库连接
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "cgin"
  DB_USER: "postgres"
  DB_SSLMODE: "disable"
  # Valkey / Redis 缓存与队列连接
  VALKEY_HOST: "valkey"
  VALKEY_PORT: "6379"
  VALKEY_DB: "0"
  # 存储与邮件配置
  STORAGE_DRIVER: "s3"
  MAILER_DRIVER: "smtp"
  MAILER_HOST: "mailpit"
  MAILER_PORT: "1025"
  # 异步队列并发度
  QUEUE_CONCURRENCY: "10"
  # 允许扩展自定义非敏感环境变量键值对
  extraEnv: {}

# 运行期敏感凭据（存储在 Secret 中）
secret:
  # 是否创建内部 Secret。若设为 false 且指定 existingSecret，将直接引用集群已有的 Secret
  create: true
  existingSecret: ""
  # 默认密钥值（生产环境必须覆盖或通过 existingSecret 注入）
  JWT_SECRET: "change-this-jwt-secret-min-32-chars-long!"
  APP_KEY: "change-this-app-key-min-32-chars-long!"
  DB_PASSWORD: "postgres-password"
  VALKEY_PASSWORD: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  # 扩展敏感键值对
  extraSecret: {}

# 本地持久化存储（若 STORAGE_DRIVER=local 时开启挂载到 /app/storage）
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: ""
  mountPath: /app/storage

# 数据库初始播种与前置任务 (Helm Hook Job)
initJob:
  enabled: false
  command:
    - /app/cgin
    - db:seed
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "0"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

