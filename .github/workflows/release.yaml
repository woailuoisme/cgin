# GitHub Actions — 统一发布流水线 (Release & Delivery)
# 职责分工:
#   1. docker-build:   构建 Linux amd64 容器镜像并推送到 GHCR
#   2. helm-release:   提取版本，打包并以 OCI 协议推送 Helm Chart 至 GHCR
#   3. github-release: git-cliff 提取提交日志并创建正式 GitHub Release

name: Release & Delivery

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  # ── 阶段 1: 构建 Docker 镜像并推送至 GHCR ────────────────────────────────
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 阶段 2: 打包并推送 Helm Chart 至 GHCR (OCI) ─────────────────────────
  helm-release:
    name: Push Helm Chart (OCI)
    runs-on: ubuntu-24.04
    needs: [docker-build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish Helm Chart to GHCR
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${VERSION}" == "main" || "${VERSION}" == "master" ]]; then
            CHART_VER=$(grep '^version:' ./helm/cgin/Chart.yaml | awk '{print $2}')
            SEMVER="${CHART_VER}-dev.${GITHUB_SHA::7}"
          else
            SEMVER="${VERSION#v}"
          fi
          OCI_TARGET="oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts"

          helm lint ./helm/cgin
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

          mkdir -p dist
          helm package ./helm/cgin --version "${SEMVER}" --app-version "${VERSION}" -d dist
          helm push dist/*.tgz "${OCI_TARGET}"

  # ── 阶段 3: 创建 GitHub Release 并附带变更日志 ────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [helm-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          prerelease: auto
          draft: false

